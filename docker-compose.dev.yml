services:
  vector-db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: always
    environment:
      POSTGRES_DB: vectors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vector_data:/var/lib/postgresql/data
    networks:
      - common-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  python-api:
    build: .
    container_name: vector-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env   # ✅ FIXED
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgvector-db:5432/vectors
      LLM_MODEL: llama-3.3-70b-versatile
    volumes:
      - .:/app
      - lora_data:/app/lora_adapter
    depends_on:
      vector-db:
        condition: service_healthy
    networks:
      - common-net

networks:
  common-net:
    external: true

volumes:
  vector_data:
  lora_data: